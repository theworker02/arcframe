name: Bug report
description: Report a defect with evidence
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands, OS, Node version, arc doctor output
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Confirmed vs inferred findings
