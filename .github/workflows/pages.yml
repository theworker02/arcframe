name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Sync brand assets
        run: node ./scripts/sync-brand-assets.mjs
      - name: Build dashboard + docs
        env:
          ARCFRAME_SITE_URL: https://theworker02.github.io/arcframe
          ARCFRAME_DOCS_BASE: /arcframe/docs/
        run: |
          pnpm --filter @arcframe/dashboard build
          pnpm --filter @arcframe/docs build
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -a apps/dashboard/dist/. _site/
          mkdir -p _site/docs
          # VitePress outDir is apps/docs/.vitepress/dist
          cp -a apps/docs/.vitepress/dist/. _site/docs/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
